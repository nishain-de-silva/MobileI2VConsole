
name: Build MobileI2VConsole with ONNX Models

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Convert Models and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install maui-android

      
      - name: Install model conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/convert/requirements.txt
          python -m pip install einops
          python -c "import einops; print('einops imported successfully:', einops.__version__)"

      - name: Convert all four models to ONNX
        run: |
          python scripts/convert/convert_all.py \
            --output src/MobileI2VConsole/Resources/Raw/models/ \
            --device cpu

      - name: Verify converted models
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="src/MobileI2VConsole/Resources/Raw/models"

          for file in \
            vae_encoder.onnx \
            qwen2_encoder.onnx \
            mobilei2v_unet.onnx \
            turbo_vaed.onnx \
            models_manifest.json
          do
            if [ ! -s "$MODEL_DIR/$file" ]; then
              echo "::error::Missing or empty model file: $file"
              exit 1
            fi
            ls -lh "$MODEL_DIR/$file"
          done

          du -sh "$MODEL_DIR"

      - name: Restore Android project
        run: |
          dotnet restore \
            src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Publish APK with bundled models
        run: |
          dotnet publish \
            src/MobileI2VConsole/MobileI2VConsole.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          find src/MobileI2VConsole/bin/Release/net10.0-android \
            -type f -name '*.apk' \
            -exec cp {} artifacts/ \;

          if ! find artifacts -type f -name '*.apk' \
            | grep -q .; then
            echo "::error::No APK was produced"
            exit 1
          fi

          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-APK-with-Models
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
