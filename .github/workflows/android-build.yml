
name: Build MobileI2VConsole APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Publish Android APK
        run: >-
          dotnet publish
          src/MobileI2VConsole/MobileI2VConsole.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk

      - name: Collect APK files
        shell: pwsh
        run: |
          $output = "artifacts"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $apks = Get-ChildItem `
            -Path "src/MobileI2VConsole/bin/Release/net10.0-android" `
            -Filter "*.apk" `
            -File `
            -Recurse

          if (-not $apks) {
            Write-Host "No APK found. Publish output follows:"
            Get-ChildItem `
              -Path "src/MobileI2VConsole/bin/Release/net10.0-android" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            throw "Build completed without a discoverable APK."
          }

          foreach ($apk in $apks) {
            Copy-Item $apk.FullName -Destination $output
            Write-Host "Collected: $($apk.Name)"
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
